<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis - Skolvix</title>
    <link rel="stylesheet" href="style.css?v=2.0">
    <style>
        .timer-display {
            display: none;
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
            font-family: var(--font-display);
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .timer-display.warning {
            color: var(--red);
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="header">
            <div class="logo">⚡ Skolvix by javas</div>
            <div class="user-stats">
                <div class="stat-pill koin">🪙 <span id="koinDisplay">0</span></div>
            </div>
        </div>

        <!-- TAMPILAN SOAL -->
        <div class="card" id="quizCard" style="position:relative;">
            <div class="timer-display" id="timerDisplay"></div>
            <div class="quiz-progress">Soal <span id="soalKe">1</span> dari <span id="totalSoal">10</span></div>
            <div class="quiz-subject-tag" id="subjectTag"></div>
            <div class="quiz-question" id="pertanyaan">Memuat soal...</div>
            <div id="opsiContainer"></div>
            <div class="answer-feedback hidden" id="answerFeedback">
                <div class="answer-feedback-icon" id="feedbackIcon"></div>
                <div class="answer-feedback-text" id="feedbackText"></div>
            </div>
        </div>

        <!-- TAMPILAN HASIL -->
        <div class="card hidden" id="resultCard">
            <h2 class="text-center">Hasil Kuis</h2>
            <div class="result-score" id="resultScore">0<span>/100</span></div>
            <div class="koin-gain" id="koinGain">+0 Koin IQ</div>
            <div class="feedback-box" id="feedbackBox"></div>
            <button class="btn btn-secondary mt-10" id="toggleReviewBtn">Lihat Pembahasan Soal</button>
            <div class="review-section hidden" id="reviewSection"></div>
            <button class="btn btn-primary mt-10" id="backToHomeBtn">Kembali ke Dashboard</button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="feedback-personas.js"></script>
    <script src="quizai.js"></script>
</body>

</html>
